name: Webapp CI

on:
  pull_request:
    paths:
      - "webapp/**"

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t prueba-celsia-internet-webapp:${{ github.sha }} .

